[project]
name = "mergington"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "black>=25.12.0",
    "fastapi>=0.127.0",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "isort>=7.0.0",
    "pytest>=9.0.2",
    "requests>=2.32.5",
    "ruff>=0.14.10",
    "uvicorn[standard]>=0.40.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.flake8]
max-line-length = 88

[project.scripts]
# Install main dependencies from requirements.txt
install = "uv pip install -r requirements.txt"
# Install dev dependencies from requirements-dev.txt
install-dev = "uv pip install -r requirements-dev.txt"
# Update requirements.txt from the current lock file
update-reqs = "uv pip freeze > requirements.txt"
# Update requirements-dev.txt from the current lock file
update-dev-reqs = "uv pip freeze > requirements-dev.txt"
